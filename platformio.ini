; Doorman, a Wi-Fi doorman for devices that can't sign themselves in.
;
; Build for your board:
;   pio run -e stickc-plus2 -t upload     (M5StickC Plus2, 8 MB)
;   pio run -e stickc-plus  -t upload     (M5StickC Plus,  4 MB)
;
; Ports are autodetected. If you have several boards attached, set
; upload_port / monitor_port in a local platformio_override.ini rather than
; editing this file.

[env]
; pioarduino rather than the stock espressif32 platform: NAT
; (esp_netif_napt_enable) needs CONFIG_LWIP_IPV4_NAPT compiled into the
; prebuilt lwIP, and the WPA2-Enterprise path uses the IDF 5 esp_eap_client API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stick-c
framework = arduino

board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified@^0.2.7

build_flags =
    -DCORE_DEBUG_LEVEL=3

; The platform ships only an m5stick-c board file, and it names the "m5stick_c"
; variant that Arduino core 3.x renamed. Each env points at the right one.
;
; Deliberately no -DARDUINO_M5STICK_C_PLUS anywhere: the Plus2 dropped the
; AXP192 PMU for a GPIO power latch, so M5Unified must autodetect the board
; rather than be told what it is. The boot log prints what it detected.

[env:stickc-plus2]
board_build.variant = m5stack_stickc_plus2
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Nobody has reported running this target yet. The Plus differs only in flash
; size and its AXP192 PMU, both handled at runtime. Reports welcome.
[env:stickc-plus]
board_build.variant = m5stack_stickc_plus
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
